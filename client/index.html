<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Meta Tags (SEO) -->
    <title>CODEHALAAM — Free Code Hosting with XP Rewards</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codehalaam.vercel.app/" />

    <meta name="twitter:url" content="https://codehalaam.vercel.app/" />

    <meta name="twitter:image" content="https://codehalaam.vercel.app/og-image.png" />

    <!-- AEO (Answer Engine Optimization) — structured data for AI search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CODEHALAAM",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "description": "CODEHALAAM is a gamified code hosting platform that combines the best of GitHub with XP-based rewards. Free private repos, unlimited collaborators, pull requests, and issues.",
      "url": "https://codehalaam.vercel.app",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "JustShipitAI"
      },
      "featureList": [
        "Unlimited public and private repositories",
        "Unlimited collaborators",
        "Pull requests with reviews",
        "Issues with labels and assignees",
        "Gamification: XP, levels, achievements, streaks",
        "Contribution heatmap",
        "Verified badges",
        "Role-based access control"
      ]
    }
    </script>

    <!-- FAQ structured data (AEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is CODEHALAAM really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CODEHALAAM offers unlimited private repositories, unlimited collaborators, pull requests, issues, and code review at no cost. There is no per-seat pricing."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between CODEHALAAM and GitHub?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CODEHALAAM offers the same core features as GitHub — repositories, pull requests, issues, code review — but adds a gamification layer with XP, levels, and achievements. Everything GitHub charges for (private repos, unlimited collaborators) is free on CODEHALAAM."
          }
        },
        {
          "@type": "Question",
          "name": "Does CODEHALAAM support private repositories?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CODEHALAAM supports both public and private repositories. Private codexes are hidden from unauthorized viewers and return a 404 (not 403) to maintain privacy."
          }
        }
      ]
    }
    </script>
